<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector DB Dashboard</title>
    <link rel="stylesheet" href="/dashboard/dashboard.css">
    <link rel="icon" type="image/png" href="/dashboard/assets/logo.png">
</head>
<body>
    <div class="container">
        <header role="banner">
            <div style="display: flex; align-items: center; gap: 18px;">
                <img src="/dashboard/assets/logo.png" alt="VectorDB Logo" style="height: 48px; width: 48px; border-radius: 8px; background: #23263A; box-shadow: 0 2px 8px rgba(0,0,0,0.12);">
                <h1>Vector DB Dashboard</h1>
            </div>
            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="stat-value">0</div>
                    <div>Collections</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">0</div>
                    <div>Documents</div>
                </div>
            </div>
        </header>
        <nav aria-label="Main navigation">
            <div class="tabs">
                <button class="tab-button active" onclick="showTab('collections')" aria-selected="true" aria-controls="collections">Collections</button>
                <button class="tab-button" onclick="showTab('documents')" aria-selected="false" aria-controls="documents">Documents</button>
                <button class="tab-button" onclick="showTab('search')" aria-selected="false" aria-controls="search">Search</button>
                <button class="tab-button" onclick="showTab('console')" aria-selected="false" aria-controls="console">Console</button>
            </div>
        </nav>
        <main>
            <section id="collections" class="tab-content active" aria-labelledby="collections">
                <h2>Collections</h2>
                <button onclick="showCreateCollection()">Create Collection</button>
                <div id="collections-list">
                    <p>Loading collections...</p>
                </div>
                <div id="create-collection-modal" class="modal" style="display: none;">
                    <div class="modal-content">
                        <h3>Create Collection</h3>
                        <input type="text" id="collection-name" placeholder="Collection Name">
                        <select id="collection-metric">
                            <option value="cosine">Cosine</option>
                            <option value="euclidean">Euclidean</option>
                            <option value="dot">Dot Product</option>
                        </select>
                        <input type="number" id="collection-dimension" placeholder="Dimension" value="768">
                        <button onclick="createCollection()">Create</button>
                        <button onclick="hideCreateCollection()">Cancel</button>
                    </div>
                </div>
            </section>
            <section id="documents" class="tab-content" aria-labelledby="documents">
                <h2>Documents</h2>
                <select id="doc-collection-select">
                    <option value="">Select a collection</option>
                </select>
                <div id="documents-list">
                    <p>Select a collection to view documents</p>
                </div>
                <button onclick="loadDocuments()">Load Documents</button>
            </section>
            <section id="search" class="tab-content" aria-labelledby="search">
                <h2>Search</h2>
                <select id="search-collection-select">
                    <option value="">Select a collection</option>
                </select>
                <textarea id="search-query" placeholder="Enter embedding as comma-separated values (e.g., 0.1, 0.2, 0.3, ...)"></textarea>
                <input type="number" id="search-limit" placeholder="Top K" value="10">
                <button onclick="performSearch()">Search</button>
                <div id="search-results"></div>
            </section>
            <section id="console" class="tab-content" aria-labelledby="console">
                <h2>API Console</h2>
                <div class="console-input">
                    <select id="console-method">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                    </select>
                    <input type="text" id="console-endpoint" placeholder="/api/v1/collections" value="/api/v1/collections">
                    <button onclick="executeConsoleCommand()">Execute</button>
                </div>
                <textarea id="console-body" placeholder="Request body (JSON)" rows="5"></textarea>
                <textarea id="console-output" readonly rows="10"></textarea>
            </section>
        </main>
    </div>
    <script src="/dashboard/dashboard.js"></script>
</body>
</html>
